<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>Frontend Mentor | Tip calculator app</title>
</head>

<body>
  <main>
    <img src="images/logo.svg" alt="Splitter" class="logo">

    
    <div class="calculator">
      <div class="input-section">
        <div class="bill-input">
          <label for="bill">Bill</label>
          <div class="input-container">
            <img src="images/icon-dollar.svg" alt="$" class="input-icon">
            <input type="number" id="bill" placeholder="0">
          </div>
        </div>

        <div class="tip-section">
          <p>Select Tip %</p>
          <div class="tip-grid">
            <button class="tip-btn">5%</button>
            <button class="tip-btn">10%</button>
            <button class="tip-btn">15%</button>
            <button class="tip-btn">25%</button>
            <button class="tip-btn">50%</button>
            <input type="number" placeholder="Custom" class="custom-tip">
          </div>
        </div>

        <div class="people-input">
          <label for="people">Number of People</label>
          <div class="input-container">
            <img src="images/icon-person.svg" alt="Person" class="input-icon">
            <input type="number" id="people" placeholder="0">
          </div>
        </div>
      </div>

      <div class="result-section">
        <div class="amounts">
          <div class="amount-item">
            <div class="amount-label">
              <p>Tip Amount</p>
              <span>/ person</span>
            </div>
            <p class="amount" id="tip-amount">$0.00</p>
          </div>

          <div class="amount-item">
            <div class="amount-label">
              <p>Total</p>
              <span>/ person</span>
            </div>
            <p class="amount" id="total-per-person">$0.00</p>
          </div>
        </div>

        <button class="reset-btn" disabled>RESET</button>
      </div>
    </div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="#">Vanessa</a>.
  </footer>

  <script src="script.js"></script>
</body>

</html>
